name: CI

# ubuntu-latest migrates to Ubuntu 26 on 2026-10-19, so the runner is pinned.
# Every action below targets the Node 24 runtime; the Node 20 ones are deprecated.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run the full suite
        # DuckDB is embedded, so the load tests need no service and no gate:
        # they write to a temporary file or to :memory:.
        run: pytest -q --maxfail=1 --disable-warnings --cov=src --cov-report=term-missing

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: etl-cnpj:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max