[mypy]
python_version = 3.10
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
# Sem isso o mypy pula o corpo das funcoes sem anotacao -- em src/ sao 31, e o
# pipeline nao tinha nenhuma checagem dentro delas.
check_untyped_defs = True

[mypy-tests.*]
ignore_errors = true
